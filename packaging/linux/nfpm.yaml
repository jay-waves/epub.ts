# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: epub-ts
arch: amd64
platform: linux
version: ${EPUB_TS_VERSION}
release: 1
version_schema: semver
section: utils
priority: optional
maintainer: jay-waves
description: A focused EPUB reader built with web technologies and a native launcher.
vendor: jay-waves
homepage: https://github.com/jay-waves/epub.ts
license: MIT
depends:
  - xdg-utils
contents:
  - src: release/epub.ts
    dst: /usr/bin/epub.ts
    file_info:
      mode: 0755
  - src: packaging/linux/epub.ts.desktop
    dst: /usr/share/applications/epub.ts.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/epub.ts.service
    dst: /usr/lib/systemd/user/epub.ts.service
    file_info:
      mode: 0644
  - src: assets/icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/epub.ts.png
    file_info:
      mode: 0644
  - src: LICENSE.txt
    dst: /usr/share/licenses/epub.ts/LICENSE.txt
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/scripts/refresh-desktop.sh
  postremove: packaging/linux/scripts/refresh-desktop.sh

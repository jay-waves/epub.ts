name: Release Extension

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          node -e "const pkg=require('./package.json'); const expected=`v${pkg.version}`; const actual=process.env.RELEASE_TAG; if(actual!==expected){console.error(`Release tag ${actual} does not match package.json version ${expected}.`); process.exit(1)}"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Build release ZIP
        shell: pwsh
        run: pnpm package

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip

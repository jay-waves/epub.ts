<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>EPUB Viewer</title>
  </head>
  <body>
    <div id="app" class="reader-app">
      <aside class="reader-dock-shell">
        <div class="reader-dock">
          <button id="toggle-flow-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Switch to scrolling mode" aria-label="Switch to scrolling mode">
            <span class="dock-button-content"><i id="flow-icon" data-lucide="rows-3"></i></span>
          </button>

          <button id="toggle-theme-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Change theme" aria-label="Change theme">
            <span class="dock-button-content">
              <i class="theme-icon" data-lucide="palette"></i>
              <span id="theme-count" class="dock-button-count">1</span>
            </span>
          </button>

          <button id="decrease-font-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Decrease font size" aria-label="Decrease font size">
            <span class="dock-button-content"><i data-lucide="minus"></i></span>
          </button>

          <button id="increase-font-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Increase font size" aria-label="Increase font size">
            <span class="dock-button-content"><i data-lucide="plus"></i></span>
          </button>

          <button id="decrease-width-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Narrower layout" aria-label="Narrower layout">
            <span class="dock-button-content"><i data-lucide="minimize-2"></i></span>
          </button>

          <button id="increase-width-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Wider layout" aria-label="Wider layout">
            <span class="dock-button-content"><i data-lucide="maximize-2"></i></span>
          </button>

          <button id="open-search-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Search" aria-label="Search">
            <span class="dock-button-content"><i data-lucide="search"></i></span>
          </button>

          <button id="open-toc-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Table of contents" aria-label="Table of contents">
            <span class="dock-button-content"><i data-lucide="list-tree"></i></span>
          </button>

          <button id="export-button" class="tooltip tooltip-right tooltip-neutral" type="button" data-tip="Export original EPUB" aria-label="Export original EPUB">
            <span class="dock-button-content"><i data-lucide="download"></i></span>
          </button>
        </div>
      </aside>

      <main class="reader-stage">
        <div id="reader-root" class="reader-frame"></div>
      </main>

      <button id="page-left-zone" class="page-click-zone page-click-zone--left" type="button" aria-label="Previous page"></button>
      <button id="page-right-zone" class="page-click-zone page-click-zone--right" type="button" aria-label="Next page"></button>

      <div id="reading-progress" class="reader-progress" role="slider" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div id="reading-progress-label" class="reader-progress-label" hidden></div>
        <div class="reader-progress-track">
          <div id="reading-progress-fill" class="reader-progress-fill"></div>
        </div>
      </div>

      <div id="search-nav" class="search-nav" hidden>
        <button id="search-prev-button" class="tooltip tooltip-bottom tooltip-neutral" type="button" data-tip="Previous result" aria-label="Previous result">
          <i data-lucide="chevron-left"></i>
        </button>
        <span id="search-count" class="search-count">0 / 0</span>
        <button id="search-next-button" class="tooltip tooltip-bottom tooltip-neutral" type="button" data-tip="Next result" aria-label="Next result">
          <i data-lucide="chevron-right"></i>
        </button>
        <form id="search-form" class="search-form">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Search text"
            autocomplete="off"
          />
        </form>
        <button id="search-close-button" class="tooltip tooltip-bottom tooltip-neutral" type="button" data-tip="Close search" aria-label="Close search">
          <i data-lucide="x"></i>
        </button>
      </div>

      <dialog id="toc-modal" class="modal">
        <div class="modal-box toc-modal-box">
          <div id="toc-root" class="toc-root">
            <p class="text-sm text-base-content/60">Open a book to show its table of contents.</p>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button>close</button>
        </form>
      </dialog>
    </div>

    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>

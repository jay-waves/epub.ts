<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>EPUB Viewer</title>
  </head>
  <body>
    <div id="app" class="reader-app">
      <aside class="reader-dock-shell">
        <div class="reader-dock">
          <button id="toggle-flow-button" type="button" title="切换滚动模式" aria-label="切换滚动模式">
            <i id="flow-icon" data-lucide="rows-3"></i>
          </button>

          <button id="toggle-theme-button" type="button" title="切换主题" aria-label="切换主题">
            <i class="theme-icon" data-lucide="palette"></i>
            <span id="theme-count" class="dock-button-count">1</span>
          </button>

          <button id="decrease-font-button" type="button" title="减小字体" aria-label="减小字体">
            <i data-lucide="minus"></i>
          </button>

          <button id="increase-font-button" type="button" title="增大字体" aria-label="增大字体">
            <i data-lucide="plus"></i>
          </button>

          <button id="decrease-width-button" type="button" title="更紧凑版式" aria-label="更紧凑版式">
            <i data-lucide="minimize-2"></i>
          </button>

          <button id="increase-width-button" type="button" title="更疏朗版式" aria-label="更疏朗版式">
            <i data-lucide="maximize-2"></i>
          </button>

          <button id="open-search-button" type="button" title="搜索" aria-label="搜索">
            <i data-lucide="search"></i>
          </button>

          <button id="export-button" type="button" title="导出原始 EPUB" aria-label="导出原始 EPUB">
            <i data-lucide="download"></i>
          </button>
        </div>
      </aside>

      <main class="reader-stage">
        <div id="reader-root" class="reader-frame"></div>
      </main>

      <button id="page-left-zone" class="page-click-zone page-click-zone--left" type="button" aria-label="上一页"></button>
      <button id="page-right-zone" class="page-click-zone page-click-zone--right" type="button" aria-label="下一页"></button>

      <button id="page-status-button" class="reader-page-status" type="button" aria-live="polite" title="打开目录" aria-label="打开目录">
        <span id="page-status-text">--</span>
      </button>

      <div id="search-nav" class="search-nav" hidden>
        <button id="search-prev-button" type="button" title="上一个结果" aria-label="上一个结果">
          <i data-lucide="chevron-left"></i>
        </button>
        <span id="search-count" class="search-count">0 / 0</span>
        <button id="search-next-button" type="button" title="下一个结果" aria-label="下一个结果">
          <i data-lucide="chevron-right"></i>
        </button>
        <button id="search-close-button" type="button" title="关闭搜索" aria-label="关闭搜索">
          <i data-lucide="x"></i>
        </button>
      </div>

      <dialog id="toc-modal" class="modal">
        <div class="modal-box toc-modal-box max-w-3xl">
          <div id="toc-root" class="toc-root">
            <p class="text-sm text-base-content/60">打开图书后显示目录。</p>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button>close</button>
        </form>
      </dialog>

      <dialog id="search-modal" class="modal">
        <div class="modal-box toc-modal-box search-modal-box max-w-xl">
          <form id="search-form" class="search-form">
            <input
              id="search-input"
              class="search-input"
              type="search"
              placeholder="搜索正文"
              autocomplete="off"
            />
          </form>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button>close</button>
        </form>
      </dialog>
    </div>

    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
